<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewind the Map - Task Kanban Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .column {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .column-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .task-count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .task {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #ddd;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .task:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .task.high-priority {
            border-left-color: #e74c3c;
        }

        .task.medium-priority {
            border-left-color: #f39c12;
        }

        .task.low-priority {
            border-left-color: #27ae60;
        }

        .task-id {
            font-size: 0.8rem;
            color: #666;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .task-title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 8px;
        }

        .task-assignee {
            background: #f8f9fa;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .task-hours {
            background: #e3f2fd;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .task-description {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.4;
            margin-top: 8px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin-top: 50px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            color: white;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Rewind the Map</h1>
        <p>Task Management Kanban Board</p>
    </div>

    <div class="stats" id="stats">
        <div class="stat">
            <span class="stat-number" id="total-tasks">-</span>
            <span class="stat-label">Total Tasks</span>
        </div>
        <div class="stat">
            <span class="stat-number" id="in-progress">-</span>
            <span class="stat-label">In Progress</span>
        </div>
        <div class="stat">
            <span class="stat-number" id="completed">-</span>
            <span class="stat-label">Completed</span>
        </div>
    </div>

    <div class="loading" id="loading">🔄 Loading tasks...</div>

    <div class="kanban-board" id="kanban-board" style="display: none;">
        <div class="column">
            <div class="column-header">
                <div class="column-title">📋 Backlog</div>
                <div class="task-count" id="backlog-count">0</div>
            </div>
            <div id="backlog-tasks"></div>
        </div>

        <div class="column">
            <div class="column-header">
                <div class="column-title">📝 Todo</div>
                <div class="task-count" id="todo-count">0</div>
            </div>
            <div id="todo-tasks"></div>
        </div>

        <div class="column">
            <div class="column-header">
                <div class="column-title">🔄 In Progress</div>
                <div class="task-count" id="in-progress-count">0</div>
            </div>
            <div id="in-progress-tasks"></div>
        </div>

        <div class="column">
            <div class="column-header">
                <div class="column-title">👀 Review</div>
                <div class="task-count" id="review-count">0</div>
            </div>
            <div id="review-tasks"></div>
        </div>

        <div class="column">
            <div class="column-header">
                <div class="column-title">✅ Done</div>
                <div class="task-count" id="done-count">0</div>
            </div>
            <div id="done-tasks"></div>
        </div>
    </div>

    <script>
        // Embedded task data
        const taskData = {
            "tasks": [
                {
                    "id": "TASK-001",
                    "title": "Initialize Git repository",
                    "status": "review",
                    "phase": "Phase 1",
                    "priority": "high",
                    "assignee": "chris-aldworth",
                    "created": "2025-09-19T16:38:29.450Z",
                    "updated": "2025-09-19T20:46:30.309Z",
                    "estimatedHours": 1,
                    "actualHours": 0,
                    "dependencies": [],
                    "description": "COMPLETED: Git repository initialized, project structure cleaned (2,810→66 files), SSH keys configured, GitHub sync successful, hosting research completed - ready for development!",
                    "acceptanceCriteria": []
                },
                {
                    "id": "TASK-002",
                    "title": "Set up project structure",
                    "status": "todo",
                    "phase": "Phase 1",
                    "priority": "high",
                    "assignee": "Unassigned",
                    "created": "2025-09-19T16:38:29.450Z",
                    "updated": "2025-09-19T16:38:29.450Z",
                    "estimatedHours": 4,
                    "actualHours": 0,
                    "dependencies": ["TASK-001"],
                    "description": "Create folder structure for frontend, backend, and shared components",
                    "acceptanceCriteria": []
                }
            ],
            "columns": {
                "backlog": [],
                "todo": ["TASK-002"],
                "in-progress": [],
                "review": ["TASK-001"],
                "done": []
            },
            "metadata": {
                "lastUpdated": "2025-09-19T20:46:30.309Z",
                "version": "1.0.0"
            }
        };

        function loadTasks() {
            try {
                const tasks = taskData.tasks;
                const columns = taskData.columns;
                
                // Update stats
                document.getElementById('total-tasks').textContent = tasks.length;
                document.getElementById('in-progress').textContent = columns['in-progress'].length;
                document.getElementById('completed').textContent = columns['done'].length;
                
                // Clear all columns
                Object.keys(columns).forEach(column => {
                    const container = document.getElementById(`${column}-tasks`);
                    const count = document.getElementById(`${column}-count`);
                    if (container) container.innerHTML = '';
                    if (count) count.textContent = columns[column].length;
                });
                
                // Add tasks to columns
                tasks.forEach(task => {
                    const taskElement = createTaskElement(task);
                    const container = document.getElementById(`${task.status}-tasks`);
                    if (container) {
                        container.appendChild(taskElement);
                    }
                });
                
                // Show the board
                document.getElementById('loading').style.display = 'none';
                document.getElementById('kanban-board').style.display = 'grid';
                
            } catch (error) {
                document.getElementById('loading').innerHTML = '❌ Error loading tasks: ' + error.message;
            }
        }

        function createTaskElement(task) {
            const taskDiv = document.createElement('div');
            taskDiv.className = `task ${task.priority}-priority`;
            
            const priorityEmoji = {
                'high': '🔴',
                'medium': '🟡',
                'low': '🟢'
            };
            
            taskDiv.innerHTML = `
                <div class="task-id">${priorityEmoji[task.priority]} ${task.id}</div>
                <div class="task-title">${task.title}</div>
                <div class="task-meta">
                    <span class="task-assignee">👤 ${task.assignee}</span>
                    <span class="task-hours">⏱️ ${task.estimatedHours}h</span>
                </div>
                <div class="task-description">${task.description}</div>
            `;
            
            return taskDiv;
        }

        // Load tasks when page loads
        document.addEventListener('DOMContentLoaded', loadTasks);
    </script>
</body>
</html>
