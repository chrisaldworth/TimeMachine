name: production
on:
  workflow_dispatch:

protection_rules:
  - type: required_reviewers
    required_reviewers: 2
  - type: wait_timer
    wait_timer: 300

environment_variables:
  NODE_ENV: production
  PORT: ${{ secrets.PRODUCTION_PORT }}
  DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
  REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
  JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
  MAPBOX_ACCESS_TOKEN: ${{ secrets.PRODUCTION_MAPBOX_ACCESS_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.PRODUCTION_AWS_REGION }}
  AWS_S3_BUCKET: ${{ secrets.PRODUCTION_AWS_S3_BUCKET }}
  SMTP_HOST: ${{ secrets.PRODUCTION_SMTP_HOST }}
  SMTP_PORT: ${{ secrets.PRODUCTION_SMTP_PORT }}
  SMTP_USER: ${{ secrets.PRODUCTION_SMTP_USER }}
  SMTP_PASS: ${{ secrets.PRODUCTION_SMTP_PASS }}
  CORS_ORIGIN: ${{ secrets.PRODUCTION_CORS_ORIGIN }}
  HELMET_CSP_ENABLED: true
  HELMET_HSTS_ENABLED: true
