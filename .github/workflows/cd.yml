name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  # Job 1: Staging Deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: docker build and push, or cloud deployment
          echo "✅ Staging deployment completed!"

      - name: Health check
        run: |
          echo "🔍 Running health checks..."
          # Add health check commands here
          # Example: curl health endpoint, check service status
          echo "✅ Health checks passed!"

      - name: Notify deployment
        run: |
          echo "📢 Staging deployment notification sent!"
          # Add notification logic here (Slack, email, etc.)

  # Job 2: Production Deployment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          # Add your production deployment commands here
          # Example: docker build and push, or cloud deployment
          echo "✅ Production deployment completed!"

      - name: Health check
        run: |
          echo "🔍 Running health checks..."
          # Add health check commands here
          # Example: curl health endpoint, check service status
          echo "✅ Health checks passed!"

      - name: Notify deployment
        run: |
          echo "📢 Production deployment notification sent!"
          # Add notification logic here (Slack, email, etc.)

  # Job 3: Rollback (if needed)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure()
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback deployment
        run: |
          echo "🔄 Rolling back deployment..."
          # Add rollback commands here
          # Example: revert to previous version, restore database
          echo "✅ Rollback completed!"

      - name: Notify rollback
        run: |
          echo "📢 Rollback notification sent!"
          # Add notification logic here
