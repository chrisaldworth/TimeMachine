<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewind the Map - Task Kanban Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .column {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .column-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .column-icon {
            font-size: 1.5rem;
            margin-right: 10px;
        }

        .column-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .column-count {
            background: #667eea;
            color: white;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.9rem;
            margin-left: auto;
        }

        .task {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #ddd;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .task:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .task.high-priority {
            border-left-color: #e74c3c;
        }

        .task.medium-priority {
            border-left-color: #f39c12;
        }

        .task.low-priority {
            border-left-color: #27ae60;
        }

        .task-id {
            font-size: 0.8rem;
            color: #666;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .task-title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #666;
        }

        .task-phase {
            background: #f8f9fa;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .task-hours {
            font-weight: 600;
        }

        .priority-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .priority-high { background: #e74c3c; }
        .priority-medium { background: #f39c12; }
        .priority-low { background: #27ae60; }

        .stats {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
        }

        @media (max-width: 768px) {
            .kanban-board {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Rewind the Map</h1>
        <p>Task Management Kanban Board</p>
    </div>

    <div class="stats" id="stats">
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-number" id="total-tasks">-</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="in-progress">-</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="done">-</div>
                <div class="stat-label">Done</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="progress">-</div>
                <div class="stat-label">Progress %</div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadTasks()">🔄 Refresh Tasks</button>

    <div class="loading" id="loading">Loading tasks...</div>

    <div class="kanban-board" id="kanban-board" style="display: none;">
        <div class="column">
            <div class="column-header">
                <div class="column-icon">📋</div>
                <div class="column-title">Backlog</div>
                <div class="column-count" id="backlog-count">0</div>
            </div>
            <div id="backlog-tasks"></div>
        </div>

        <div class="column">
            <div class="column-header">
                <div class="column-icon">📝</div>
                <div class="column-title">To Do</div>
                <div class="column-count" id="todo-count">0</div>
            </div>
            <div id="todo-tasks"></div>
        </div>

        <div class="column">
            <div class="column-header">
                <div class="column-icon">🔄</div>
                <div class="column-title">In Progress</div>
                <div class="column-count" id="in-progress-count">0</div>
            </div>
            <div id="in-progress-tasks"></div>
        </div>

        <div class="column">
            <div class="column-header">
                <div class="column-icon">👀</div>
                <div class="column-title">Review</div>
                <div class="column-count" id="review-count">0</div>
            </div>
            <div id="review-tasks"></div>
        </div>

        <div class="column">
            <div class="column-header">
                <div class="column-icon">✅</div>
                <div class="column-title">Done</div>
                <div class="column-count" id="done-count">0</div>
            </div>
            <div id="done-tasks"></div>
        </div>
    </div>

    <script>
        async function loadTasks() {
            try {
                const response = await fetch('tasks.json');
                const data = await response.json();
                renderTasks(data);
            } catch (error) {
                console.error('Error loading tasks:', error);
                document.getElementById('loading').innerHTML = '❌ Error loading tasks. Make sure tasks.json exists.';
            }
        }

        function renderTasks(data) {
            const { tasks, columns, metadata } = data;
            
            // Update stats
            document.getElementById('total-tasks').textContent = tasks.length;
            document.getElementById('in-progress').textContent = columns['in-progress'].length;
            document.getElementById('done').textContent = columns.done.length;
            
            const progress = tasks.length > 0 ? Math.round((columns.done.length / tasks.length) * 100) : 0;
            document.getElementById('progress').textContent = progress + '%';

            // Update column counts
            Object.keys(columns).forEach(column => {
                const countElement = document.getElementById(column + '-count');
                if (countElement) {
                    countElement.textContent = columns[column].length;
                }
            });

            // Render tasks in each column
            Object.keys(columns).forEach(column => {
                const container = document.getElementById(column + '-tasks');
                if (container) {
                    container.innerHTML = '';
                    
                    columns[column].forEach(taskId => {
                        const task = tasks.find(t => t.id === taskId);
                        if (task) {
                            const taskElement = createTaskElement(task);
                            container.appendChild(taskElement);
                        }
                    });
                }
            });

            // Show the board
            document.getElementById('loading').style.display = 'none';
            document.getElementById('kanban-board').style.display = 'grid';
        }

        function createTaskElement(task) {
            const div = document.createElement('div');
            div.className = `task ${task.priority}-priority`;
            
            const priorityClass = `priority-${task.priority}`;
            
            div.innerHTML = `
                <div class="task-id">${task.id}</div>
                <div class="task-title">${task.title}</div>
                <div class="task-meta">
                    <div>
                        <span class="priority-indicator ${priorityClass}"></span>
                        <span class="task-phase">${task.phase}</span>
                    </div>
                    <div class="task-hours">${task.estimatedHours}h</div>
                </div>
            `;
            
            // Add click handler to show task details
            div.addEventListener('click', () => {
                showTaskDetails(task);
            });
            
            return div;
        }

        function showTaskDetails(task) {
            const details = `
Task ID: ${task.id}
Title: ${task.title}
Status: ${task.status}
Phase: ${task.phase}
Priority: ${task.priority}
Assignee: ${task.assignee || 'Unassigned'}
Estimated Hours: ${task.estimatedHours}
Actual Hours: ${task.actualHours}
Created: ${new Date(task.created).toLocaleDateString()}
Updated: ${new Date(task.updated).toLocaleDateString()}
${task.description ? `Description: ${task.description}` : ''}
            `;
            
            alert(details);
        }

        // Load tasks on page load
        loadTasks();
        
        // Auto-refresh every 30 seconds
        setInterval(loadTasks, 30000);
    </script>
</body>
</html>
